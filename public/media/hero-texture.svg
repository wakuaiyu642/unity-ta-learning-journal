    <circle cx="960.0" cy="618.5" r="5" fill="#96e3cd" fill-opacity="0.34"/>
       <circle cx="960.0" cy="618.5" r="16" fill="none" stroke="#96e3cd" stroke-opacity="0.1"/>
    <circle cx="1230.0" cy="465.8" r="3.2" fill="#96e3cd" fill-opacity="0.18"/>
       <circle cx="1230.0" cy="465.8" r="10" fill="none" stroke="#96e3cd" stroke-opacity="0.1"/>
    <circle cx="1500.0" cy="306.7" r="3.2" fill="#96e3cd" fill-opacity="0.18"/>
       <circle cx="1500.0" cy="306.7" r="10" fill="none" stroke="#96e3cd" stroke-opacity="0.1"/>
    <circle cx="1770.0" cy="162.9" r="3.2" fill="#96e3cd" fill-opacity="0.18"/>
       <circle cx="1770.0" cy="162.9" r="10" fill="none" stroke="#96e3cd" stroke-opacity="0.1"/>
  </g>
  <rect width="1920" height="1080" fill="url(#hero-vignette)"/>
  <rect width="1920" height="1080" filter="url(#hero-grain)" opacity="0.14"/>
