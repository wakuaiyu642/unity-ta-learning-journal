<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="Growth pipeline hero texture">
  <title>Growth pipeline hero texture</title>
  <defs>
    <linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2b27"/>
      <stop offset="0.42" stop-color="#123f3a"/>
      <stop offset="0.78" stop-color="#0e332e"/>
      <stop offset="1" stop-color="#0a2b27"/>
    </linearGradient>
    <radialGradient id="hero-glow-mint" cx="0.78" cy="0.16" r="0.62">
      <stop offset="0" stop-color="#58c4a6" stop-opacity="0.3"/>
      <stop offset="0.55" stop-color="#58c4a6" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#58c4a6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hero-glow-amber" cx="0.16" cy="0.88" r="0.5">
      <stop offset="0" stop-color="#c98f4f" stop-opacity="0.18"/>
      <stop offset="0.6" stop-color="#c98f4f" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#c98f4f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hero-vignette" cx="0.5" cy="0.42" r="0.78">
      <stop offset="0.5" stop-color="#04120f" stop-opacity="0"/>
      <stop offset="1" stop-color="#04120f" stop-opacity="0.38"/>
    </radialGradient>
    <linearGradient id="hero-streak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#96e3cd" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#96e3cd" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#96e3cd" stop-opacity="0"/>
    </linearGradient>
    <pattern id="hero-grid-fine" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#f6f2e9" stroke-opacity="0.055"/>
    </pattern>
    <pattern id="hero-grid-major" width="220" height="220" patternUnits="userSpaceOnUse">
      <path d="M220 0H0V220" fill="none" stroke="#f6f2e9" stroke-opacity="0.07"/>
    </pattern>
    <linearGradient id="hero-pipeline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58c4a6" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#58c4a6" stop-opacity="0.24"/>
      <stop offset="0.7" stop-color="#96e3cd" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ecc387" stop-opacity="0"/>
    </linearGradient>
    <filter id="hero-grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="20261108" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray">
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#hero-bg)"/>
  <rect width="1920" height="1080" fill="url(#hero-glow-mint)"/>
  <rect width="1920" height="1080" fill="url(#hero-glow-amber)"/>
  <rect width="1920" height="1080" fill="url(#hero-grid-fine)"/>
  <rect width="1920" height="1080" fill="url(#hero-grid-major)"/>
  <path d="M -100 980 C 320 760 700 980 1080 700 C 1380 476 1660 560 2020 300 L 2020 380 C 1700 640 1440 566 1160 756 C 780 1020 380 830 -100 1050 Z" fill="url(#hero-streak)" opacity="0.55"/>
  <path d="M 120 916 C 420 780 720 860 980 700 C 1240 540 1500 560 1800 260" fill="none" stroke="url(#hero-pipeline)" stroke-width="1.4" stroke-dasharray="2 16" stroke-linecap="round"/>
  <g><circle cx="150.0" cy="920.0" r="3.2" fill="#96e3cd" fill-opacity="0.18"/>
