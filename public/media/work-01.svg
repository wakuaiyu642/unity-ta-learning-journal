<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-label="Work 01 - Shader Effects Collection">
  <title>Work 01 - Shader Effects Collection</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a544b"/>
      <stop offset="0.46" stop-color="#123f3a"/>
      <stop offset="1" stop-color="#092521"/>
    </linearGradient>
    <radialGradient id="bg-glow" cx="0.72" cy="0.28" r="0.9">
      <stop offset="0" stop-color="#58c4a6" stop-opacity="0.3"/>
      <stop offset="0.45" stop-color="#58c4a6" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#58c4a6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#061b18" stop-opacity="0"/>
      <stop offset="0.62" stop-color="#061b18" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#061b18" stop-opacity="0.66"/>
    </linearGradient>
    <linearGradient id="ribbon-mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58c4a6" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#58c4a6" stop-opacity="0.34"/>
      <stop offset="0.7" stop-color="#96e3cd" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#58c4a6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ribbon-amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c98f4f" stop-opacity="0"/>
      <stop offset="0.34" stop-color="#c98f4f" stop-opacity="0.3"/>
      <stop offset="0.72" stop-color="#ecc387" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ecc387" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="line-mint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58c4a6" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#96e3cd" stop-opacity="0.9"/>
      <stop offset="0.72" stop-color="#58c4a6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ecc387" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid-fine" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#f6f2e9" stroke-opacity="0.05"/>
    </pattern>
    <pattern id="grid-major" width="160" height="160" patternUnits="userSpaceOnUse">
      <path d="M160 0H0V160" fill="none" stroke="#f6f2e9" stroke-opacity="0.055"/>
    </pattern>
    <filter id="soft-hero" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <filter id="soft-16" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="1001" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray">
        <feFuncA type="linear" slope="0.46"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <defs>
      <radialGradient id="orb-glow">
        <stop offset="0" stop-color="#96e3cd" stop-opacity="0.9"/>
        <stop offset="1" stop-color="#96e3cd" stop-opacity="0"/>
      </radialGradient>
    </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#bg-glow)"/>
  <rect width="1200" height="750" fill="url(#grid-fine)"/>
  <rect width="1200" height="750" fill="url(#grid-major)"/>
  <g filter="url(#soft-hero)" opacity="0.95">
      <ellipse cx="880" cy="205" rx="330" ry="240" fill="#58c4a6" fill-opacity="0.2"/>
      <ellipse cx="300" cy="600" rx="320" ry="190" fill="#c98f4f" fill-opacity="0.14"/>
      <ellipse cx="600" cy="370" rx="230" ry="180" fill="#96e3cd" fill-opacity="0.08"/>
    </g>
    <g>
      <path d="M-80 622 C 180 470 380 700 680 520 C 920 378 1100 430 1280 360 L 1280 520 C 1080 560 900 572 700 612 C 430 666 180 742 -80 682 Z" fill="url(#ribbon-mint)"/>
      <path d="M-80 470 C 120 400 300 470 520 400 C 780 318 980 360 1280 250 L 1280 342 C 1000 430 820 422 600 472 C 380 522 160 562 -80 542 Z" fill="url(#ribbon-amber)"/>
      <path d="M-80 330 C 220 260 420 330 640 270 C 860 212 1080 250 1280 190 L 1280 242 C 1040 302 860 292 660 332 C 420 380 200 402 -80 382 Z" fill="url(#ribbon-mint)" opacity="0.8"/>
    </g>
    <g fill="none" stroke="url(#line-mint)" stroke-linecap="round">
      <path d="M-60 604 C 200 470 380 700 680 526 C 920 384 1100 436 1280 366" stroke-width="2" opacity="0.95"/>
      <path d="M-60 636 C 200 502 380 732 680 558 C 920 416 1100 468 1280 398" stroke-width="1.1" opacity="0.4"/>
      <path d="M-60 458 C 120 388 300 458 520 388 C 780 306 980 348 1280 238" stroke-width="1.5" opacity="0.7"/>
      <path d="M-60 490 C 120 420 300 490 520 420 C 780 338 980 380 1280 270" stroke-width="0.9" opacity="0.3"/>
    </g>
    <g fill="none" stroke="#f6f2e9" stroke-opacity="0.16">
      <path d="M-60 570 C 200 438 380 668 680 494 C 920 352 1100 404 1280 334" stroke-width="1"/>
      <path d="M-60 424 C 120 354 300 424 520 354 C 780 272 980 314 1280 204" stroke-width="0.8"/>
    </g>
    <g filter="url(#soft-16)">
      <circle cx="1010" cy="300" r="46" fill="url(#orb-glow)" fill-opacity="0.55"/>
      <circle cx="220" cy="470" r="34" fill="url(#orb-glow)" fill-opacity="0.45"/>
    </g>
    <g><circle cx="287.1" cy="278.4" r="2.0" fill="#ecc387" fill-opacity="0.35"/>
      <circle cx="751.3" cy="618.5" r="3.6" fill="#96e3cd" fill-opacity="0.61"/>
      <circle cx="769.6" cy="318.0" r="2.1" fill="#96e3cd" fill-opacity="0.23"/>
      <circle cx="729.6" cy="391.4" r="4.5" fill="#ecc387" fill-opacity="0.52"/>
      <circle cx="665.9" cy="369.4" r="4.3" fill="#96e3cd" fill-opacity="0.67"/>
      <circle cx="635.3" cy="428.0" r="2.5" fill="#96e3cd" fill-opacity="0.52"/>
      <circle cx="621.4" cy="182.0" r="3.2" fill="#ecc387" fill-opacity="0.58"/>
      <circle cx="612.5" cy="432.7" r="3.3" fill="#96e3cd" fill-opacity="0.58"/>
      <circle cx="901.3" cy="355.6" r="4.2" fill="#96e3cd" fill-opacity="0.22"/>
    </g>
  <rect width="1200" height="750" fill="url(#scrim)"/>
  <rect width="1200" height="750" filter="url(#grain)" opacity="0.17"/>
  <rect x="26" y="26" width="1148" height="698" rx="22" fill="none" stroke="#f6f2e9" stroke-opacity="0.07"/>
  <g font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Arial, sans-serif">
    <g transform="translate(72 64)">
      <rect x="-10" y="-18" width="24" height="24" rx="7" fill="none" stroke="#58c4a6" stroke-opacity="0.5"/>
      <path d="M-3 -10 L3 -10 M-3 -4 L6 -4" fill="none" stroke="#58c4a6" stroke-opacity="0.8" stroke-width="1.6" stroke-linecap="round"/>
      <text x="30" y="2" font-size="12" letter-spacing="4.5" fill="#f6f2e9" fill-opacity="0.55">WORK 01</text>
    </g>
    <text x="1128" y="64" text-anchor="end" font-size="11" letter-spacing="3.2" fill="#f6f2e9" fill-opacity="0.3">GROWTH PIPELINE</text>
    <text x="72" y="712" font-size="58" font-weight="700" letter-spacing="4" fill="#f6f2e9" fill-opacity="0.13">01</text>
    <text x="1128" y="706" text-anchor="end" font-family="ui-monospace, 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="12" letter-spacing="2.4" fill="#58c4a6" fill-opacity="0.62">SHADER FX / LAYERED BANDS</text>
  </g>
</svg>
